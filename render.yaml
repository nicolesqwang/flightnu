# Free-tier blueprint. Two Render web services; everything else is free elsewhere:
#   - Database: Neon free Postgres (does not expire, unlike Render's free Postgres,
#     which is deleted 30 days after creation). Paste its URL into DATABASE_URL.
#   - Schedule: .github/workflows/ingest.yml calls /api/internal/ingest every hour
#     (free GitHub Actions). Render's free plan has no background workers, and
#     free web services sleep after 15 idle minutes, so an in-process scheduler
#     can't run there.
services:
  # FastAPI REST API
  - type: web
    name: flightnu-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://flightnu-web.onrender.com
      - key: PRICE_PROVIDER
        value: travelpayouts
      - key: TRAVELPAYOUTS_TOKEN
        sync: false
      - key: TRAVELPAYOUTS_MARKET
        value: us
      - key: SERPAPI_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: MAX_ACTIVE_TRACKERS
        value: "12"
      - key: AUTO_SEED
        value: "true"
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false

  # Next.js frontend
  - type: web
    name: flightnu-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        value: https://flightnu-api.onrender.com
